# Ревью merge request на GitLab s1 (http://10.10.1.101:8929).
# Раннер local: docker, сеть lab, clone_url http://gitlab:8929.
# В CI/CD variables проекта положи DEEPSEEK_API_KEY (masked).
# Без ключа джоба всё равно пишет review.md по diff и RAG.

stages:
  - review

ai-review:
  stage: review
  image: golang:1.22-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "50"
    RAG_OLLAMA_URL: http://10.10.1.101:11434
    RAG_EMBED_MODEL: nomic-embed-text
    REVIEW_API_URL: https://api.deepseek.com/chat/completions
    REVIEW_MODEL: deepseek-v4-flash
  script:
    - go run ./cmd/review -out review.md
  artifacts:
    when: always
    paths:
      - review.md
    expire_in: 14 days
