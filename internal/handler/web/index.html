<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent</title>
  <link rel="stylesheet" href="/static/style.css?v=cook8">
</head>
<body>
  <div class="layout" id="layout">
    <div class="app">
      <header class="chat-bar">
        <button type="button" id="settingsBtn" class="chat-bar__menu" title="Настройки" aria-label="Открыть настройки">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.7 1 1.2 1.5 1.2H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <span class="chat-bar__title" id="chatTitle">Чат</span>
        <button type="button" id="clearBtn" class="btn btn--ghost btn--sm chat-bar__new">Новый чат</button>
        <div class="token-meter chat-bar__meter" id="tokenMeter" aria-live="polite">
          <div class="token-meter__bar"><span id="tokenBarFill" class="token-meter__fill"></span></div>
          <p class="token-meter__text" id="tokenMeterText"></p>
        </div>
      </header>

      <main class="chat" id="chat">
        <div class="welcome" id="welcome">
          <h2>Ассистент</h2>
          <p>Спросите про еду. Локальная модель отвечает сама, без поиска по книге.</p>
        </div>
      </main>

      <div class="net-banner" id="netBanner" hidden>
        <span id="netBannerText">Нет интернета</span>
        <button type="button" id="netRetryBtn" class="btn btn--accent btn--xs">Повторить</button>
      </div>

      <footer class="composer">
        <form id="chatForm" class="composer__form">
          <textarea id="messageInput" class="composer__input" placeholder="Сообщение" rows="1" autofocus></textarea>
          <button type="submit" id="sendBtn" class="btn btn--primary" aria-label="Отправить">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>
      </footer>
    </div>

    <div class="settings-backdrop" id="settingsBackdrop" hidden></div>
    <aside class="nav settings" id="settingsPanel" aria-hidden="true">
      <div class="nav__brand">
        <div class="nav__brand-text">
          <strong>Настройки</strong>
          <span>Локальная модель</span>
        </div>
        <button type="button" id="settingsCloseBtn" class="nav__collapse" title="Закрыть" aria-label="Закрыть настройки">✕</button>
      </div>

      <div class="nav__scroll">
      <section class="nav__block profile-form">
        <h3>Параметры</h3>
        <label class="profile-field">
          <span>Температура</span>
          <input type="number" id="tuneTemperature" min="0" max="2" step="0.05" value="0.15">
        </label>
        <label class="profile-field">
          <span>Макс. токенов</span>
          <input type="number" id="tuneMaxTokens" min="32" max="4096" step="1" value="320">
        </label>
        <label class="profile-field">
          <span>Окно контекста</span>
          <input type="number" id="tuneContext" min="1024" max="32768" step="256" value="8192">
        </label>
        <label class="profile-field">
          <span>Квантование</span>
          <select id="tuneQuant" class="nav__select" aria-label="Квантование"></select>
        </label>
        <label class="profile-field">
          <span>Шаблон промпта</span>
          <textarea id="tunePrompt" rows="8"></textarea>
        </label>
        <button type="button" id="saveTuneBtn" class="btn btn--accent btn--sm nav__btn">Сохранить</button>
        <button type="button" id="tuneBtn" class="btn btn--ghost btn--sm nav__btn">Сравнить до и после</button>
        <p class="nav__meta" id="tuneMeta">—</p>
      </section>
      </div>
    </aside>

    <aside class="debug-panel" id="debugPanel" aria-hidden="true">
      <div class="debug-panel__header">
        <h2 class="debug-panel__title">Сырой лог</h2>
        <button type="button" id="clearDebugBtn" class="btn btn--ghost btn--sm">Очистить</button>
      </div>
      <div class="debug-panel__body" id="debugLog">
        <p class="debug-panel__empty">Запросы появятся здесь.</p>
      </div>
    </aside>
  </div>

  <script src="/static/chat.js?v=cook11"></script>
</body>
</html>
