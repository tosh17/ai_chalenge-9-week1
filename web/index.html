<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>День 35. Docker на s1</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --ink: #1c1915;
      --muted: #3d3832;
      --line: #d8d1c4;
      --paper: #fffcf7;
      --head: #2c4a3e;
      --user: #2c4a3e;
    }
    html, body { height: 100%; }
    html { font-size: 18px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 44rem;
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 1rem 1rem 0;
      box-sizing: border-box;
    }
    header { padding: .4rem .2rem 1rem; }
    h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 .35rem; }
    .lead { margin: 0; color: var(--muted); }
    #log {
      flex: 1;
      overflow: auto;
      padding: .2rem .1rem 1rem;
    }
    .msg { display: flex; margin: .55rem 0; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 92%;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: .75rem .95rem;
    }
    .msg.user .bubble {
      background: var(--user);
      color: #f6f3ec;
      border-color: var(--user);
    }
    .bubble p { margin: .3rem 0 .65rem; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h2 { font-size: 1.15rem; line-height: 1.3; color: var(--head); margin: .8rem 0 .3rem; }
    .bubble ul, .bubble ol { margin: .2rem 0 .8rem; padding-left: 1.3rem; }
    code { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: .92em; background: #efeae0; padding: .05em .35em; border-radius: 4px; }
    .svc { padding: .7rem 0; border-bottom: 1px solid var(--line); }
    .svc:first-child { padding-top: .1rem; }
    .svc:last-child { border-bottom: 0; padding-bottom: .1rem; }
    .svc b { display: block; font-size: 1.05rem; }
    .svc i { display: block; margin-top: .1rem; font-style: normal; color: var(--muted); }
    @media (min-width: 720px) {
      .svc { display: grid; grid-template-columns: 12rem 11rem minmax(0, 1fr); gap: .3rem 1rem; align-items: baseline; }
      .svc b, .svc i { display: block; margin: 0; }
    }
    .status { color: var(--muted); margin: 0; }
    form {
      display: flex;
      gap: .5rem;
      align-items: flex-end;
      padding: .8rem 0 1rem;
      background: var(--bg);
    }
    textarea {
      flex: 1;
      box-sizing: border-box;
      min-height: 2.8rem;
      max-height: 8rem;
      padding: .65rem .85rem;
      font: inherit;
      line-height: 1.4;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      resize: none;
    }
    button {
      font: inherit;
      font-size: 1rem;
      background: #1c1915;
      color: #f6f3ec;
      border: 0;
      border-radius: 12px;
      padding: .65rem 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>День 35. Docker на s1</h1>
      <p class="lead">Пиши своими словами. Если непонятно, ассистент спросит, а не вывалит весь список.</p>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="composer">
      <textarea id="docker" rows="1" placeholder="Например: что это board"></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const field = document.getElementById("docker");
    const sendBtn = document.getElementById("send");
    const turns = [];

    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function inline(s) {
      return esc(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function cellsOf(line) {
      const markdown = line.trim().startsWith("|");
      const parts = line.split("|").map((cell) => cell.trim());
      if (!markdown) return parts;
      if (parts[0] === "") parts.shift();
      if (parts.length && parts[parts.length - 1] === "") parts.pop();
      return parts;
    }

    function table(lines) {
      const rows = lines.map(cellsOf);
      return rows.map((row) =>
        '<div class="svc"><b>' + inline(row[0] || "") + "</b><i>" + inline(row[1] || "") + "</i><span>" + inline(row[2] || "порты не опубликованы") + "</span></div>"
      ).join("");
    }

    function renderHTML(text) {
      const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
      const filled = lines.map((line) => line.trim()).filter(Boolean);
      if (filled.length > 1 && filled.every((line) => line.includes("|"))) return table(filled);
      let html = "";
      let para = [];
      let list = [];
      let listTag = "ul";
      let grid = [];
      const flushPara = () => {
        if (!para.length) return;
        html += "<p>" + inline(para.join(" ")) + "</p>";
        para = [];
      };
      const flushList = () => {
        if (!list.length) return;
        html += "<" + listTag + ">" + list.map((item) => "<li>" + inline(item) + "</li>").join("") + "</" + listTag + ">";
        list = [];
      };
      const pushItem = (tag, item) => {
        if (list.length && listTag !== tag) flushList();
        listTag = tag;
        list.push(item);
      };
      const flushGrid = () => {
        if (!grid.length) return;
        html += table(grid);
        grid = [];
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) {
          flushPara();
          flushList();
          flushGrid();
          continue;
        }
        if (line.includes("|") && line.split("|").length > 2) {
          flushPara();
          flushList();
          grid.push(line);
          continue;
        }
        flushGrid();
        if (line.startsWith("## ")) {
          flushPara();
          flushList();
          html += "<h2>" + inline(line.slice(3)) + "</h2>";
          continue;
        }
        if (/^[-*]\s+/.test(line)) {
          flushPara();
          pushItem("ul", line.replace(/^[-*]\s+/, ""));
          continue;
        }
        if (/^\d+\.\s+/.test(line)) {
          flushPara();
          pushItem("ol", line.replace(/^\d+\.\s+/, ""));
          continue;
        }
        flushList();
        para.push(line);
      }
      flushPara();
      flushList();
      flushGrid();
      return html || '<p class="status">Пустой ответ.</p>';
    }

    function addBubble(role, html) {
      const row = document.createElement("div");
      row.className = "msg " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = html;
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return bubble;
    }

    async function readJSON(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        return { error: text || ("Ошибка " + res.status) };
      }
    }

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      send();
    });
    field.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });

    async function send() {
      const goal = field.value.trim();
      if (!goal || sendBtn.disabled) return;
      field.value = "";
      addBubble("user", "<p>" + esc(goal) + "</p>");
      const pending = addBubble("assistant", '<p class="status">Модель выбирает команду. Это может занять около полминуты.</p>');
      sendBtn.disabled = true;
      try {
        const res = await fetch("/api/docker", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ goal, history: turns.slice(-8) })
        });
        const data = await readJSON(res);
        const reply = data.reply || data.Reply || data.error || data.Error || "Ответ не пришёл.";
        pending.innerHTML = renderHTML(reply);
        turns.push({ role: "user", content: goal }, { role: "assistant", content: reply });
      } catch (err) {
        pending.innerHTML = '<p class="status">Запрос не выполнился: ' + esc(err) + "</p>";
      } finally {
        sendBtn.disabled = false;
        field.focus();
        log.scrollTop = log.scrollHeight;
      }
    }
  </script>
</body>
</html>
